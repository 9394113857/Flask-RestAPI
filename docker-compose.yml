services:
  flask-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: flask-restapi

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      PORT: 5000
      FLASK_DEBUG: "false"

    volumes:
      # Keep the local SQLite database outside the container.
      # This is only for local Docker testing.
      - ./instance:/app/instance

      # Keep application logs outside the container.
      - ./logs:/app/logs

    restart: unless-stopped